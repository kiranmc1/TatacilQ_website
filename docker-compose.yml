version: "3.9"

services:
  frontend:
    build: ./Frontend
    container_name: frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"

  backend:
    build: ./Backend
    container_name: backend
    env_file:
      - Backend/.env
    depends_on:
      - mongodb
    ports:
      - "2000:2000"

  mongodb:
    image: mongo:8
    container_name: mongodb
    volumes:
      - mongo-data:/data/db   # use default MongoDB path
    ports:
      - "27017:27017"

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:80"   # host port 8080 ? container port 80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mongo-data:
